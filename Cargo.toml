[package]
name = "duckdb_orc"
version = "0.2.0"
edition = "2021"
description = "DuckDB extension for reading and writing Apache ORC files"

[lib]
name = "orc"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
name = "duckdb_orc"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension", "vscalar"] }
orc-rust = { git = "https://github.com/datafusion-contrib/orc-rust", rev = "2060e243cf997a297faa26f19754cc3086216ac7" }
arrow = "58"
glob = "0.3"

[features]
default = []
extension = []
